name: Bug report
description: Report a problem with HOOP
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a HOOP issue. For setup help, see [SUPPORT.md](https://github.com/GaneshVarma1/HOOP/blob/main/SUPPORT.md). For security issues, follow [SECURITY.md](https://github.com/GaneshVarma1/HOOP/blob/main/SECURITY.md) and do not post exploit details here.
  - type: input
    id: version
    attributes:
      label: HOOP version or commit
      placeholder: Version shown in the app or short commit ID
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iPhone
        - Mac
        - Android
    validations:
      required: true
  - type: input
    id: strap
    attributes:
      label: Band model
      placeholder: For example, WHOOP 5.0 or MG
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, what you expected, and what you saw.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Optional logs or screenshots
      description: Review attachments first and remove serial numbers, account details, and other personal information.
